      <circle cx="10.5" cy="10.5" r="6.5"/>

    </svg>

  <div class="lightbox__stage">
    <div class="lightbox__zoom-wrap">
      <img src="" alt="">
    </div>
    <p class="lightbox__caption"></p>
  </div>
</div>

<footer class="site-footer">© <span id="year"></span> Lou Parisot</footer>
