/* ---------- décodage des traces (base64 -> grille 40x24) ---------- */
function decoderBase64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function traceBit(trace, row, col) {
  const b = row * 40 + col;
  return (trace[b >> 3] & (1 << (b & 7))) !== 0;
}
VOEUX.forEach(v => { v.trace = decoderBase64(v.trace_b64); });

function traceVide(trace) {
  for (let i = 0; i < trace.length; i++) if (trace[i]) return false;
  return true;
}

/* ---------- similarité (identique à correspondanceEntre() du firmware) ---------- */
function similarite(a, b) {
  let produit = 0, normeA = 0, normeB = 0;
  for (const c of a.categories) normeA += c.pct * c.pct;
  for (const c of b.categories) normeB += c.pct * c.pct;
  for (const ca of a.categories) for (const cb of b.categories)
    if (ca.nom === cb.nom) produit += ca.pct * cb.pct;
  if (normeA <= 0 || normeB <= 0) return 0;
  return produit / (Math.sqrt(normeA) * Math.sqrt(normeB));
}

const N = VOEUX.length;
const aretes = [];
for (let i = 0; i < N; i++)
  for (let j = i + 1; j < N; j++)
    if (similarite(VOEUX[i], VOEUX[j]) > 0.35) aretes.push([i, j]);

/* précalcule, pour chaque vœu, ses correspondances triées (comme voeuxTopCorrespondances) */
VOEUX.forEach((v, i) => {
  const scores = [];
  VOEUX.forEach((autre, j) => { if (j !== i) scores.push({ i: j, score: similarite(v, autre) }); });
  scores.sort((a, b) => b.score - a.score);
  v._matchs = scores;
});

/* ---------- placement : même spirale dorée que placerNoeud() ---------- */
function placerNoeud(index) {
  const angle = index * 137.5 * Math.PI / 180;
  const rayon = 50 * Math.sqrt(index + 1);
  return { wx: rayon * Math.cos(angle), wy: rayon * Math.sin(angle) };
}
VOEUX.forEach((v, i) => { const p = placerNoeud(i); v.wx = p.wx; v.wy = p.wy; });

/* ---------- dérive aléatoire persistante (comme DeriveEtat) ---------- */
const derive = VOEUX.map(() => {
  let vx = (Math.random() * 21 - 10) / 6; if (vx === 0) vx = 0.3;
  let vy = (Math.random() * 21 - 10) / 6; if (vy === 0) vy = 0.3;
  return { dx: 0, dy: 0, vx, vy };
});
const PORTEE = 22;

/* ---------- rendu ---------- */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let camX = 0, camY = 0;
const CHAR_W = 8, LINE_H = 20, PAD_X = 10;
function boxWidth(nom) { return Math.max(nom.length * CHAR_W + PAD_X * 2, 46); }

const compteEl = document.getElementById('compte');
compteEl.textContent = N + ' WISH' + (N === 1 ? '' : 'ES');

let dragging = false, moved = false, startX = 0, startY = 0, startCamX = 0, startCamY = 0;
let lastX = 0, lastY = 0;
const hint = document.getElementById('hint');
let hintCache = false;

function ecranXY(v) {
  return {
    x: v.wx + derive[VOEUX.indexOf(v)].dx - camX + W / 2,
    y: v.wy + derive[VOEUX.indexOf(v)].dy - camY + H / 2
  };
}

function boucle() {
  // dérive
  VOEUX.forEach((v, i) => {
    const d = derive[i];
    d.dx += d.vx; d.dy += d.vy;
    if (d.dx > PORTEE || d.dx < -PORTEE) { d.vx = -d.vx; d.dx = Math.max(-PORTEE, Math.min(PORTEE, d.dx)); }
    if (d.dy > PORTEE || d.dy < -PORTEE) { d.vy = -d.vy; d.dy = Math.max(-PORTEE, Math.min(PORTEE, d.dy)); }
  });

  const sx = new Array(N), sy = new Array(N), lw = new Array(N);
  VOEUX.forEach((v, i) => {
    sx[i] = v.wx + derive[i].dx - camX + W / 2;
    sy[i] = v.wy + derive[i].dy - camY + H / 2;
    lw[i] = boxWidth(v.nom);
  });

  // répulsion (identique à l'esprit du firmware)
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const dx = sx[j] - sx[i], dy = sy[j] - sy[i];
      let dist = Math.sqrt(dx * dx + dy * dy); if (dist < 1) dist = 1;
      const distMin = (lw[i] + lw[j]) / 2 + 14;
      if (dist < distMin) {
        const push = (distMin - dist) * 0.14;
        const ux = dx / dist, uy = dy / dist;
        derive[i].dx -= ux * push; derive[i].dy -= uy * push;
        derive[j].dx += ux * push; derive[j].dy += uy * push;
        sx[i] -= ux * push; sy[i] -= uy * push;
        sx[j] += ux * push; sy[j] += uy * push;
      }
    }
  }

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // traits de correspondance, gris, uniquement si les deux bouts sont proches de l'écran
  ctx.strokeStyle = 'rgba(180,180,180,0.55)';
  ctx.lineWidth = 1;
  const marge = 60;
  aretes.forEach(([i, j]) => {
    if ((sx[i] < -marge && sx[j] < -marge) || (sx[i] > W + marge && sx[j] > W + marge)) return;
    if ((sy[i] < -marge && sy[j] < -marge) || (sy[i] > H + marge && sy[j] > H + marge)) return;
    ctx.beginPath(); ctx.moveTo(sx[i], sy[i]); ctx.lineTo(sx[j], sy[j]); ctx.stroke();
  });

  // nœuds
  ctx.font = '12px "Courier New", monospace';
  ctx.textBaseline = 'middle';
  VOEUX.forEach((v, i) => {
    if (sx[i] < -80 || sx[i] > W + 80 || sy[i] < -40 || sy[i] > H + 40) return;
    const w = lw[i], h = 20;
    const bx = sx[i] - w / 2, by = sy[i] - h / 2;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, w, h);
    ctx.fillStyle = '#fff';
    ctx.fillText(v.nom, bx + PAD_X, sy[i] + 1);

    if (!traceVide(v.trace)) {
      const tx = bx, ty = by + h + 4, tw = 40, th = 18;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.strokeRect(tx - 1, ty - 1, tw + 2, th + 2);
      const img = ctx.createImageData(tw, th);
      for (let row = 0; row < 18; row++) {
        const srcRow = Math.floor(row * 24 / 18);
        for (let col = 0; col < tw; col++) {
          const on = traceBit(v.trace, srcRow, col);
          const o = (row * tw + col) * 4;
          img.data[o] = img.data[o+1] = img.data[o+2] = 255;
          img.data[o+3] = on ? 255 : 0;
        }
      }
      ctx.putImageData(img, tx, ty);
    }
    v._boite = { bx, by, w, h: h + (traceVide(v.trace) ? 0 : 26) };
  });

  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

/* ---------- interaction : glisser pour naviguer, taper un nom ---------- */
function pointDePage(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function debut(e) {
  const p = pointDePage(e);
  dragging = true; moved = false;
  startX = lastX = p.x; startY = lastY = p.y;
  startCamX = camX; startCamY = camY;
  canvas.classList.add('dragging');
  if (!hintCache) { hint.style.opacity = '0'; hintCache = true; }
}
function bouge(e) {
  if (!dragging) return;
  const p = pointDePage(e);
  const dx = p.x - startX, dy = p.y - startY;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
  camX = startCamX - dx; camY = startCamY - dy;
  lastX = p.x; lastY = p.y;
  e.preventDefault();
}
function fin(e) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  if (!moved) {
    for (let i = N - 1; i >= 0; i--) {
      const v = VOEUX[i], b = v._boite;
      if (!b) continue;
      if (lastX >= b.bx && lastX <= b.bx + b.w && lastY >= b.by && lastY <= b.by + b.h) {
        ouvrirFiche(v);
        break;
      }
    }
  }
}
canvas.addEventListener('mousedown', debut);
window.addEventListener('mousemove', bouge);
window.addEventListener('mouseup', fin);
canvas.addEventListener('touchstart', debut, { passive: true });
canvas.addEventListener('touchmove', bouge, { passive: false });
canvas.addEventListener('touchend', fin);

/* ---------- fiche détaillée ---------- */
const panneau = document.getElementById('panneau');
const pNom = document.getElementById('pNom');
const pCategories = document.getElementById('pCategories');
const pMatchs = document.getElementById('pMatchs');
const pFontaine = document.getElementById('pFontaine');
const traceCanvas = document.getElementById('traceCanvas');
const traceCtx = traceCanvas.getContext('2d');

function ligneNomValeur(container, nom, pct) {
  const d = document.createElement('div');
  d.className = 'ligne';
  d.innerHTML = '<span class="n">' + nom + '</span><span class="p">' + pct + '%</span>';
  container.appendChild(d);
}

function ouvrirFiche(v) {
  pNom.textContent = v.nom.trim() ? v.nom : 'ANONYMOUS';

  traceCtx.clearRect(0, 0, 200, 120);
  if (traceVide(v.trace)) {
    traceCtx.fillStyle = '#7a7a7a';
    traceCtx.font = '12px "Courier New", monospace';
    traceCtx.textAlign = 'center';
    traceCtx.fillText('NO DRAWING', 100, 60);
  } else {
    const ech = 5;
    traceCanvas.width = 40 * ech; traceCanvas.height = 24 * ech;
    traceCtx.fillStyle = '#fff';
    for (let row = 0; row < 24; row++)
      for (let col = 0; col < 40; col++)
        if (traceBit(v.trace, row, col)) traceCtx.fillRect(col * ech, row * ech, ech, ech);
  }

  pCategories.innerHTML = '';
  if (!v.categories.length) {
    const d = document.createElement('div'); d.className = 'vide'; d.textContent = 'NONE';
    pCategories.appendChild(d);
  } else {
    v.categories.forEach(c => ligneNomValeur(pCategories, c.nom, c.pct));
  }

  pMatchs.innerHTML = '';
  const top = v._matchs.slice(0, 5).filter(m => m.score > 0);
  if (!top.length) {
    const d = document.createElement('div'); d.className = 'vide'; d.textContent = 'NO MATCH';
    pMatchs.appendChild(d);
  } else {
    top.forEach(m => {
      const autre = VOEUX[m.i];
      ligneNomValeur(pMatchs, autre.nom.trim() ? autre.nom : 'ANONYMOUS', Math.round(m.score * 100));
    });
  }

  const f = v.fontaine;
  pFontaine.innerHTML =
    '<div class="type">' + f.type + '</div>' +
    '<div class="adr">' + f.adresse + '</div>' +
    '<div class="com">' + f.commune + '</div>' +
    '<div class="gid">#' + f.gid + '</div>';

  panneau.classList.add('ouvert');
  document.getElementById('panneauScroll').scrollTop = 0;
}
document.getElementById('retour').addEventListener('click', () => panneau.classList.remove('ouvert'));
</script>
