<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lou Parisot — Contact</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="index.html">Lou Parisot</a>
    <nav class="site-nav">
      <a href="portfolio.html">Portfolio</a>
      <a href="texts.html">Texts</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="news.html">News</a>
    </nav>
  </div>
</header>

<main>
  <h1 class="page-title">Contact</h1>

  <div class="placeholder-note">
    Le formulaire ci-dessous a besoin d'un service tiers gratuit (Formspree) pour fonctionner — voir les instructions de configuration en fin de conversation.
  </div>

  <ul class="contact-list">
    <li><a href="mailto:louparisot@gmail.com">louparisot@gmail.com</a></li>
    <li><a href="https://instagram.com/lou_parisot" target="_blank" rel="noopener">@lou_parisot</a></li>
  </ul>

  <form class="contact-form" action="https://formspree.io/f/VOTRE_ID_FORMSPREE" method="POST">
    <div>
      <label for="name">Nom</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit">Envoyer</button>
  </form>
</main>

<footer class="site-footer">© <span id="year"></span> Lou Parisot</footer>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
